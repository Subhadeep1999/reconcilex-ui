<div class="login-page">

  <div class="login-container">

    <div class="brand-section">

      <div class="logo">
        RX
      </div>

      <h1>
        ReconcileX
      </h1>

      <p>
        Order & Payment Reconciliation Platform
      </p>

    </div>


    <div class="login-card">

      <h2>
        Create your account
      </h2>

      <p class="subtitle">
        Sign up to access your reconciliation workspace.
      </p>


      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <form (ngSubmit)="signup()">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            required
          />

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            required
          />

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            required
          />

        </div>


        <button
          type="submit"
          [disabled]="
            !email ||
            !password ||
            !confirmPassword ||
            loading
          ">

          @if (loading) {
            Creating Account...
          } @else {
            Create Account
          }

        </button>

      </form>


      <div class="login-link">

        <span>
          Already have an account?
        </span>

        <button
          type="button"
          (click)="goToLogin()">

          Sign In

        </button>

      </div>

    </div>


    <div class="footer">
      ReconcileX · Order & Payment Reconciliation
    </div>

  </div>

</div>
